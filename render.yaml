# Render blueprint for the FastAPI service. Postgres lives on Neon (pgvector built in).
services:
  - type: web
    name: helpdesk-agent-api
    runtime: docker
    rootDir: api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      # JSON map of tenant slug -> admin token, e.g. {"nimbus": "..."}; only hashes are stored
      - key: TENANT_ADMIN_TOKENS
        sync: false
      - key: TENANT_DAILY_BUDGET_USD
        value: "5"
